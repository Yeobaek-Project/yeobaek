<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다음 우편번호 검색</title>
    <style>
        body {
          margin: 0;
          padding: 0;
          font-family: Arial, sans-serif;
          width: 100%;
          height: calc(100vh); /* 앱바 높이 고려 */
          overflow: hidden;
        }
        #map {
          width: 100%;
          height: 100%;
          min-height: calc(100vh);
        }
        .loading {
          display: flex;
          justify-content: center;
          align-items: center;
          font-size: 18px;
        }
    </style>
</head>
<body>
<div id="loading" class="loading">로딩 중…</div>
<div id="map" style="display: none;"></div>

<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script>
    function initPostcode() {
      const loadingElement = document.getElementById('loading');
      const mapElement = document.getElementById('map');

      try {
        if (typeof daum !== 'undefined' && daum.Postcode) {
          // 로딩 숨기고 임베드 영역 표시
          loadingElement.style.display = 'none';
          mapElement.style.display = 'block';

          new daum.Postcode({
            oncomplete: function(data) {
              // ✅ 지번 주소만
              var jibun = data.jibunAddress || data.autoJibunAddress || "";

              // ✅ AndroidBridge 액션으로 전달
              if (window.AndroidBridge && typeof window.AndroidBridge.onSelected === 'function') {
                try { window.AndroidBridge.onSelected(jibun); } catch (e) { console.log(e); }
              } else {
                // 디버깅용 (브릿지 미연결 시 눈으로 확인)
                alert('지번주소: ' + jibun + '\n(AndroidBridge 미연결)');
              }

              // 선택 완료 후 닫기 콜백
              if (window.AndroidBridge && typeof window.AndroidBridge.onClose === 'function') {
                try { window.AndroidBridge.onClose(); } catch (e) { console.log(e); }
              }
            },
            onclose: function(/* state */) {
              // 사용자가 닫은 경우에도 onClose 통지
              if (window.AndroidBridge && typeof window.AndroidBridge.onClose === 'function') {
                try { window.AndroidBridge.onClose(); } catch (e) { console.log(e); }
              }
            },
            width: '100%',
            height: window.innerHeight || document.documentElement.clientHeight,
            autoMapping: true
          }).embed(mapElement);

        } else {
          console.error('daum.Postcode를 사용할 수 없습니다');
          loadingElement.innerHTML = '주소 검색 서비스 로드 실패<br>인터넷 연결을 확인해주세요';
          // 실패 상황을 알리고 싶다면(선택)
          if (window.AndroidBridge && typeof window.AndroidBridge.onSelected === 'function') {
            try { window.AndroidBridge.onSelected(''); } catch (e) { console.log(e); }
          }
          if (window.AndroidBridge && typeof window.AndroidBridge.onClose === 'function') {
            try { window.AndroidBridge.onClose(); } catch (e) { console.log(e); }
          }
        }
      } catch (error) {
        console.error('주소 검색 초기화 오류:', error);
        loadingElement.innerHTML = '오류 발생: ' + error.message;
      }
    }

    // 페이지 로드 완료 후 초기화 (네가 쓰던 방식 유지)
    window.onload = function() {
      setTimeout(initPostcode, 1000);
    };

    // 화면 크기 변경 시 높이 보정(선택)
    window.onresize = function() {
      var map = document.getElementById('map');
      if (map && map.style.display !== 'none') {
        map.style.height = (window.innerHeight || document.documentElement.clientHeight) + 'px';
      }
    };

    // 스크립트 로드 오류 처리
    window.onerror = function(msg, url, line, col, error) {
      console.error('JavaScript 오류:', msg, 'at', url + ':' + line);
      document.getElementById('loading').innerHTML = 'JavaScript 오류 발생<br>' + msg;
      return false;
    };
</script>
</body>
</html>
